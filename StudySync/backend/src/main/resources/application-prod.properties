# ================================================
# StudySync – application-prod.properties
# Production Profile Configuration (Day 13)
# ================================================

# ===== Server =====
server.port=${PORT:8080}

# ===== Application Name =====
spring.application.name=studysync-backend

# ===== Database Connection (Externalized Environment Variables) =====
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/studysync_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}

# ===== JPA / Hibernate Production Settings =====
# 'update' updates database schema safely without dropping existing tables
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

# ===== HikariCP Connection Pool (Production Tuned) =====
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.idle-timeout=300000

# ===== JWT Security Configuration =====
# Externalized via JWT_SECRET environment variable for production deployment
app.jwt.secret=${JWT_SECRET:c3R1ZHlzeW5jLXNlY3JldC1rZXktZm9yLWp3dC1hdXRoZW50aWNhdGlvbi0yMDI2LXN0dWR5}
app.jwt.expiration-ms=${JWT_EXPIRATION:604800000}

# ===== Production CORS Origins =====
app.cors.allowed-origins=${ALLOWED_ORIGINS:http://localhost:5500,http://127.0.0.1:5500}

# ===== Production Logging =====
logging.level.org.springframework.security=WARN
logging.level.org.hibernate.SQL=WARN
logging.level.com.studysync=INFO
