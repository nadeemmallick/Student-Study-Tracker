# ================================================
# StudySync – application.properties
# Spring Boot Backend Configuration
#
# SECURITY NOTE:
#   Secrets (DB password, etc.) live in application-local.properties
#   That file is git-ignored and NEVER committed.
#   Spring loads it automatically when the 'local' profile is active.
#
# To activate locally, add this to your IDE run config or start command:
#   --spring.profiles.active=local
# ================================================

# ===== Active Profile (dev machine) =====
spring.profiles.active=local

# ===== Server =====
server.port=8080

# ===== Application Name =====
spring.application.name=studysync-backend

# ===== MySQL Database Connection =====
spring.datasource.url=jdbc:mysql://localhost:3306/studysync_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
# username + password → set in application-local.properties (git-ignored)

# ===== JPA / Hibernate =====
# update   → applies schema changes without dropping data (use in development)
# create   → drops and recreates tables on every start
# validate → only validates schema, never changes DB
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# ===== Naming Strategy =====
# Maps camelCase Java fields → snake_case DB columns (e.g. startTime → start_time)
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

# ===== Connection Pool (HikariCP – default in Spring Boot) =====
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.idle-timeout=300000

# ===== Spring Security =====
# Disable default generated password in console during development
spring.security.user.name=admin
# password → set in application-local.properties (git-ignored)

# ===== Logging =====
logging.level.org.springframework.security=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.com.studysync=DEBUG

# ===== CORS (allow frontend on port 5500 / Live Server) =====
# Configured in SecurityConfig.java – see /config/SecurityConfig.java

# ===== JWT Configuration (Day 10) =====
# Secret: a Base64-encoded HMAC-SHA256 key (min 256 bits / 32 bytes).
# IMPORTANT for deployment: override this via environment variable or
# a production profile (--spring.profiles.active=prod) so the secret
# is never committed to source control.
# Provide the JWT_SECRET as an environment variable in production.
# The default fallback is for local development only.
app.jwt.secret=${JWT_SECRET:c3R1ZHlzeW5jLXNlY3JldC1rZXktZm9yLWp3dC1hdXRoZW50aWNhdGlvbi0yMDI2LXN0dWR5}
app.jwt.expiration-ms=604800000

# ===== Deployment Note =====
# spring.profiles.active=local is set above for development convenience.
# On a production server, override it at startup:
#   java -jar studysync-backend.jar --spring.profiles.active=prod
# and supply DB credentials + JWT secret via environment variables or a
# git-ignored application-prod.properties file.
