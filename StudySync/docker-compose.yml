version: '3.8'

services:
  # ── 1. MySQL Database Service ─────────────────────────────────────────────
  db:
    image: mysql:8.0
    container_name: studysync_db
    restart: always
    environment:
      MYSQL_DATABASE: studysync_db
      MYSQL_ROOT_PASSWORD: root_password
      MYSQL_USER: studysync_user
      MYSQL_PASSWORD: studysync_password
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot_password"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── 2. Spring Boot Backend Service ────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: studysync_backend
    restart: always
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: jdbc:mysql://db:3306/studysync_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: studysync_user
      SPRING_DATASOURCE_PASSWORD: studysync_password
      JWT_SECRET: c3R1ZHlzeW5jLXNlY3JldC1rZXktZm9yLWp3dC1hdXRoZW50aWNhdGlvbi0yMDI2LXN0dWR5
      ALLOWED_ORIGINS: http://localhost:5500,http://localhost:80,http://localhost

  # ── 3. Frontend Nginx Web Server ─────────────────────────────────────────
  frontend:
    image: nginx:alpine
    container_name: studysync_frontend
    restart: always
    ports:
      - "5500:80"
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
    depends_on:
      - backend

volumes:
  mysql_data:
