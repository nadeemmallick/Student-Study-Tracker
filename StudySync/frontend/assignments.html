<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Assignments | StudySync</title>
    <!-- Fonts & Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <link rel="icon" type="image/png" href="assets/logo/favicon.png">

    <!-- CSS -->
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/dashboard.css">
    <link rel="stylesheet" href="css/assignments.css">
</head>

<body>

    <!-- Animated background -->
    <div class="bg-gradient"></div>
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>

    <div class="app-container">

        <!-- Sidebar -->
        <aside class="sidebar glass-panel" id="sidebar">
            <div class="sidebar-header">
                <div class="brand-icon">
                    <img src="assets/logo/studysync-logo.png" alt="StudySync Logo" class="sidebar-logo-img">
                </div>
                <span class="brand-name text-gradient">StudySync</span>
                <button class="btn-icon mobile-close" id="sidebarClose">
                    <i class="fa-solid fa-xmark"></i>
                </button>
            </div>

            <nav class="sidebar-nav">
                <a href="dashboard.html" class="nav-item">
                    <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <rect width="7" height="9" x="3" y="3" rx="1"/>
                        <rect width="7" height="5" x="14" y="3" rx="1"/>
                        <rect width="7" height="9" x="14" y="12" rx="1"/>
                        <rect width="7" height="5" x="3" y="16" rx="1"/>
                    </svg>
                    <span>Dashboard</span>
                </a>
                <a href="subjects.html" class="nav-item">
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></svg>
                    <span>Subjects</span>
                </a>
                <a href="study-session.html" class="nav-item">
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="10" x2="14" y1="2" y2="2"/><line x1="12" x2="15" y1="14" y2="11"/><circle cx="12" cy="14" r="8"/></svg>
                    <span>Sessions</span>
                </a>
                <a href="assignments.html" class="nav-item active">
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect width="8" height="4" x="8" y="2" rx="1" ry="1"/><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/><path d="M12 11h4"/><path d="M12 16h4"/><path d="M8 11h.01"/><path d="M8 16h.01"/></svg>
                    <span>Assignments</span>
                </a>
                <a href="goals.html" class="nav-item">
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="6"/><circle cx="12" cy="12" r="2"/></svg>
                    <span>Goals</span>
                </a>
                <a href="notes.html" class="nav-item">
                    <i class="fa-solid fa-sticky-note"></i>
                    <span>Notes</span>
                </a>
                <a href="analytics.html" class="nav-item">
                    <i class="fa-solid fa-chart-pie"></i>
                    <span>Analytics</span>
                </a>
                <a href="profile.html" class="nav-item">
                    <i class="fa-solid fa-user"></i>
                    <span>Profile</span>
                </a>
            </nav>

            <div class="sidebar-footer">
                <div class="user-profile">
                    <div class="avatar"><i class="fa-solid fa-user"></i></div>
                    <div class="user-info">
                        <p class="user-name" id="userNameDisplay">Loading...</p>
                        <p class="user-role">Student</p>
                    </div>
                </div>
                <button class="btn-icon logout-btn" id="logoutBtn" title="Logout">
                    <i class="fa-solid fa-right-from-bracket"></i>
                </button>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="main-content">

            <!-- Topbar -->
            <header class="topbar glass-panel">
                <div class="topbar-left">
                    <button class="btn-icon mobile-menu" id="sidebarOpen">
                        <i class="fa-solid fa-bars"></i>
                    </button>
                    <div class="search-bar">
                        <i class="fa-solid fa-magnifying-glass search-icon"></i>
                        <input type="text" id="searchInput" placeholder="Search tasks...">
                    </div>
                </div>

                <div class="topbar-right">
                    <button class="btn-icon">
                        <i class="fa-regular fa-bell"></i>
                    </button>
                    <button class="btn-icon">
                        <i class="fa-solid fa-gear"></i>
                    </button>
                </div>
            </header>

            <!-- Page Content -->
            <div class="dashboard-content">

                <div class="welcome-section">
                    <div>
                        <h1 class="page-title text-gradient">Assignment Tracker 📋</h1>
                        <p class="page-subtitle">Manage your coursework and upcoming deadlines.</p>
                    </div>
                    <div class="quick-actions">
                        <button class="btn btn-primary" id="addAssignmentBtn">
                            <i class="fa-solid fa-plus"></i>
                            <span>Add Assignment</span>
                        </button>
                    </div>
                </div>

                <!-- Kanban Board Container -->
                <div class="assignments-container">

                    <!-- PENDING Column -->
                    <div class="status-column glass-panel">
                        <div class="column-header">
                            <h3><i class="fa-regular fa-clock" style="color: #f59e0b;"></i> Pending</h3>
                        </div>
                        <div class="task-list" id="pendingList">
                            <!-- Tasks injected here -->
                        </div>
                    </div>

                    <!-- IN_PROGRESS Column -->
                    <div class="status-column glass-panel">
                        <div class="column-header">
                            <h3><i class="fa-solid fa-spinner" style="color: #3b82f6;"></i> In Progress</h3>
                        </div>
                        <div class="task-list" id="inProgressList">
                            <!-- Tasks injected here -->
                        </div>
                    </div>

                    <!-- COMPLETED Column -->
                    <div class="status-column glass-panel">
                        <div class="column-header">
                            <h3><i class="fa-regular fa-circle-check" style="color: #10b981;"></i> Completed</h3>
                        </div>
                        <div class="task-list" id="completedList">
                            <!-- Tasks injected here -->
                        </div>
                    </div>
                </div>

            </div>
        </main>
    </div>

    <!-- Assignment Modal (Hidden by default) -->
    <div class="modal-overlay" id="assignmentModal">
        <div class="modal-content glass-panel">
            <div class="modal-header">
                <h3 id="modalTitle">Add Assignment</h3>
                <button class="btn-icon" id="closeModalBtn">
                    <i class="fa-solid fa-xmark"></i>
                </button>
            </div>
            <form id="assignmentForm" style="display: flex; flex-direction: column; overflow: hidden; height: 100%;">
                <div class="modal-body">
                    <input type="hidden" id="assignmentIdInput">

                    <div class="form-group">
                        <label>Title</label>
                        <input type="text" id="assignmentTitleInput" required placeholder="E.g., Read Chapter 5">
                    </div>

                    <div class="form-group">
                        <label>Subject</label>
                        <div class="input-wrap select-wrap">
                            <select id="assignmentSubjectInput" required>
                                <option value="" disabled selected>Loading subjects...</option>
                            </select>
                        </div>
                    </div>

                    <div class="form-row">
                        <div class="form-group half">
                            <label>Due Date</label>
                            <input type="date" id="assignmentDueDateInput" required>
                        </div>
                        <div class="form-group half">
                            <label>Priority</label>
                            <div class="input-wrap select-wrap">
                                <select id="assignmentPriorityInput" required>
                                    <option value="LOW">Low</option>
                                    <option value="MEDIUM" selected>Medium</option>
                                    <option value="HIGH">High</option>
                                </select>
                            </div>
                        </div>
                    </div>

                    <div class="form-group">
                        <label>Status</label>
                        <div class="input-wrap select-wrap">
                            <select id="assignmentStatusInput" required>
                                <option value="PENDING" selected>Pending</option>
                                <option value="IN_PROGRESS">In Progress</option>
                                <option value="COMPLETED">Completed</option>
                            </select>
                        </div>
                    </div>

                    <div class="form-group">
                        <label>Description (Optional)</label>
                        <textarea id="assignmentDescInput" placeholder="Add any details or links..."
                            rows="3"></textarea>
                    </div>
                </div>

                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" id="cancelModalBtn">Cancel</button>
                    <button type="submit" class="btn btn-primary">Save Assignment</button>
                </div>
            </form>
        </div>
    </div>

    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/dashboard.js"></script>
    <script src="js/assignments.js"></script>
</body>

</html>
