<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Goals | StudySync</title>
    <meta name="description" content="Set and track your daily and weekly study goals with StudySync." />
    <!-- Fonts & Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <link rel="icon" type="image/png" href="assets/logo/favicon.png">

    <!-- CSS -->
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/dashboard.css">
    <link rel="stylesheet" href="css/goals.css" />
</head>

<body>
    <!-- Animated Background -->
    <div class="bg-gradient"></div>
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>

    <div class="app-container">

        <!-- Master Sidebar -->
        <aside class="sidebar glass-panel" id="sidebar">
            <div class="sidebar-header">
                <div class="brand-icon">
                    <img src="assets/logo/studysync-logo.png" alt="StudySync Logo" class="sidebar-logo-img">
                </div>
                <h2 class="brand-name">StudySync</h2>
                <button class="btn-icon mobile-close" id="sidebarClose">
                    <i class="fa-solid fa-xmark"></i>
                </button>
            </div>

            <nav class="sidebar-nav">
                <a href="dashboard.html" class="nav-item">
                    <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <rect width="7" height="9" x="3" y="3" rx="1"/>
                        <rect width="7" height="5" x="14" y="3" rx="1"/>
                        <rect width="7" height="9" x="14" y="12" rx="1"/>
                        <rect width="7" height="5" x="3" y="16" rx="1"/>
                    </svg>
                    <span>Dashboard</span>
                </a>
                <a href="subjects.html" class="nav-item">
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></svg>
                    <span>Subjects</span>
                </a>
                <a href="study-session.html" class="nav-item">
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="10" x2="14" y1="2" y2="2"/><line x1="12" x2="15" y1="14" y2="11"/><circle cx="12" cy="14" r="8"/></svg>
                    <span>Sessions</span>
                </a>
                <a href="assignments.html" class="nav-item">
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect width="8" height="4" x="8" y="2" rx="1" ry="1"/><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/><path d="M12 11h4"/><path d="M12 16h4"/><path d="M8 11h.01"/><path d="M8 16h.01"/></svg>
                    <span>Assignments</span>
                </a>
                <a href="goals.html" class="nav-item active">
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="6"/><circle cx="12" cy="12" r="2"/></svg>
                    <span>Goals</span>
                </a>
                <a href="notes.html" class="nav-item">
                    <i class="fa-solid fa-note-sticky"></i>
                    <span>Notes</span>
                </a>
                <a href="analytics.html" class="nav-item">
                    <i class="fa-solid fa-chart-pie"></i>
                    <span>Analytics</span>
                </a>
                <a href="profile.html" class="nav-item">
                    <i class="fa-solid fa-user"></i>
                    <span>Profile</span>
                </a>
            </nav>

            <div class="sidebar-footer">
                <div class="user-profile">
                    <div class="avatar"><i class="fa-solid fa-user"></i></div>
                    <div class="user-info">
                        <p class="user-name" id="userNameDisplay">Loading...</p>
                        <p class="user-role">Student</p>
                    </div>
                </div>
                <button class="btn-icon logout-btn" id="logoutBtn" title="Logout">
                    <i class="fa-solid fa-right-from-bracket"></i>
                </button>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="main-content">

            <!-- Master Topbar -->
            <header class="topbar glass-panel">
                <div class="topbar-left">
                    <button class="btn-icon mobile-menu" id="sidebarOpen">
                        <i class="fa-solid fa-bars"></i>
                    </button>
                    <div class="search-bar">
                        <i class="fa-solid fa-magnifying-glass search-icon"></i>
                        <input type="text" placeholder="Search goals...">
                    </div>
                </div>

                <div class="topbar-right">
                    <button class="btn-icon">
                        <i class="fa-regular fa-bell"></i>
                    </button>
                    <button class="btn-icon">
                        <i class="fa-solid fa-gear"></i>
                    </button>
                </div>
            </header>

            <div class="dashboard-content">

                <div class="welcome-section">
                    <div>
                        <h1 class="page-title text-gradient">Study Goals 🎯</h1>
                        <p class="page-subtitle">Set and track your study targets.</p>
                    </div>
                    <div class="quick-actions">
                        <button class="btn btn-primary" id="addGoalBtn">
                            <i class="fa-solid fa-plus"></i> New Goal
                        </button>
                    </div>
                </div>

                <!-- Stats Row (Matching Dashboard Cards) -->
                <div class="stats-grid">
                    <div class="stat-card glass-panel">
                        <div class="stat-header">
                            <div class="stat-icon" style="background: rgba(124,58,237,0.2); color: #a78bfa;">🎯</div>
                        </div>
                        <div class="stat-value" id="statTotal">0</div>
                        <div class="stat-label" style="color: var(--text-muted);">Total Goals</div>
                    </div>
                    <div class="stat-card glass-panel">
                        <div class="stat-header">
                            <div class="stat-icon" style="background: rgba(16,185,129,0.2); color: #34d399;">✅</div>
                        </div>
                        <div class="stat-value" id="statCompleted">0</div>
                        <div class="stat-label" style="color: var(--text-muted);">Completed</div>
                    </div>
                    <div class="stat-card glass-panel">
                        <div class="stat-header">
                            <div class="stat-icon" style="background: rgba(245,158,11,0.2); color: #fbbf24;">📅</div>
                        </div>
                        <div class="stat-value" id="statDaily">0</div>
                        <div class="stat-label" style="color: var(--text-muted);">Daily Goals</div>
                    </div>
                    <div class="stat-card glass-panel">
                        <div class="stat-header">
                            <div class="stat-icon" style="background: rgba(59,130,246,0.2); color: #60a5fa;">📆</div>
                        </div>
                        <div class="stat-value" id="statWeekly">0</div>
                        <div class="stat-label" style="color: var(--text-muted);">Weekly Goals</div>
                    </div>
                </div>

                <!-- Daily Goals -->
                <div class="goals-section">
                    <div class="section-header">
                        <div class="section-title">
                            <div class="type-indicator daily"></div>
                            Daily Goals
                            <span class="section-badge" id="dailyCount">0</span>
                        </div>
                    </div>
                    <div class="goals-grid" id="dailyGoalsList">
                        <div class="loading-state">
                            <div class="spinner"></div>
                        </div>
                    </div>
                </div>

                <!-- Weekly Goals -->
                <div class="goals-section">
                    <div class="section-header">
                        <div class="section-title">
                            <div class="type-indicator weekly"></div>
                            Weekly Goals
                            <span class="section-badge" id="weeklyCount">0</span>
                        </div>
                    </div>
                    <div class="goals-grid" id="weeklyGoalsList">
                        <div class="loading-state">
                            <div class="spinner"></div>
                        </div>
                    </div>
                </div>

            </div>
        </main>
    </div>

    <!-- Goal Modal -->
    <div class="modal-overlay" id="goalModal">
        <div class="modal-content glass-panel">
            <div class="modal-header">
                <h3 id="modalTitle">New Goal</h3>
                <button class="btn-icon" id="closeModalBtn"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <form id="goalForm" style="display: flex; flex-direction: column; overflow: hidden; height: 100%;">
                <div class="modal-body">
                    <input type="hidden" id="goalId" />

                    <div class="form-group">
                        <label class="form-label" for="goalTitle">Goal Title</label>
                        <input type="text" id="goalTitle" class="form-control" placeholder="e.g. Study Math 2 Hours"
                            required />
                    </div>

                    <div class="form-row">
                        <div class="form-group half">
                            <label class="form-label" for="goalType">Goal Type</label>
                            <select id="goalType" class="form-control">
                                <option value="DAILY">Daily Goal</option>
                                <option value="WEEKLY">Weekly Goal</option>
                            </select>
                        </div>
                        <div class="form-group half">
                            <label class="form-label" for="targetHours">Target Hours</label>
                            <input type="number" id="targetHours" class="form-control" min="0.5" max="168" step="0.5"
                                value="2.0" required />
                        </div>
                    </div>
                </div>

                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" id="cancelModalBtn">Cancel</button>
                    <button type="submit" class="btn btn-primary" id="saveGoalBtn">Save Goal</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Scripts -->
    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/goals.js"></script>
</body>

</html>
