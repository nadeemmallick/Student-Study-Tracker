<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sign In – StudySync</title>
    <meta name="description" content="Sign in to StudySync and continue tracking your study sessions, assignments, and goals." />
    <link rel="stylesheet" href="css/forms.css" />
</head>
<body>

    <!-- Animated background -->
    <div class="bg-gradient"></div>
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>

    <!-- Login Card -->
    <div class="auth-wrapper">
        <div class="auth-card">

            <!-- Brand -->
            <div class="brand">
                <div class="brand-icon">📚</div>
                <span class="brand-name">StudySync</span>
            </div>

            <!-- Heading -->
            <h1 class="auth-title">Welcome back</h1>
            <p class="auth-subtitle">Sign in to continue your study journey</p>

            <!-- Error message (shown on failed login) -->
            <div id="login-error" class="error-msg" role="alert"></div>

            <!-- Login Form -->
            <form id="login-form" novalidate>

                <div class="form-group">
                    <label for="login-email">Email address</label>
                    <div class="input-wrap">
                        <span class="input-icon">✉️</span>
                        <input
                            type="email"
                            id="login-email"
                            name="email"
                            placeholder="you@example.com"
                            autocomplete="email"
                            required
                        />
                    </div>
                </div>

                <div class="form-group">
                    <label for="login-password">Password</label>
                    <div class="input-wrap">
                        <span class="input-icon">🔒</span>
                        <input
                            type="password"
                            id="login-password"
                            name="password"
                            placeholder="Your password"
                            autocomplete="current-password"
                            required
                        />
                    </div>
                </div>

                <button type="submit" id="login-btn" class="btn-primary">
                    Sign In
                </button>

            </form>

            <!-- Footer -->
            <p class="auth-footer">
                Don't have an account? <a href="register.html">Create one free</a>
            </p>

        </div>
    </div>

    <script type="module" src="js/auth.js"></script>
</body>
</html>
