<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notes | StudySync</title>
    <!-- Fonts & Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="icon" type="image/x-icon" href="assets/favicon/favicon.ico">
    <!-- Base Styles -->
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/dashboard.css">
    <link rel="stylesheet" href="css/notes.css">
</head>
<body>
    <!-- Animated Background -->
    <div class="bg-gradient"></div>
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>

    <div class="app-container">
        
        <!-- Master Sidebar -->
        <aside class="sidebar glass-panel" id="sidebar">
            <div class="sidebar-header">
                <div class="brand-icon">
                    <i class="fa-solid fa-bolt"></i>
                </div>
                <h2 class="brand-name">StudySync</h2>
                <button class="btn-icon mobile-close" id="sidebarClose">
                    <i class="fa-solid fa-xmark"></i>
                </button>
            </div>

            <nav class="sidebar-nav">
                <a href="dashboard.html" class="nav-item">
                    <i class="fa-solid fa-house"></i>
                    <span>Dashboard</span>
                </a>
                <a href="subjects.html" class="nav-item">
                    <i class="fa-solid fa-book"></i>
                    <span>Subjects</span>
                </a>
                <a href="study-session.html" class="nav-item">
                    <i class="fa-solid fa-stopwatch"></i>
                    <span>Sessions</span>
                </a>
                <a href="assignments.html" class="nav-item">
                    <i class="fa-solid fa-clipboard-list"></i>
                    <span>Assignments</span>
                </a>
                <a href="goals.html" class="nav-item">
                    <i class="fa-solid fa-bullseye"></i>
                    <span>Goals</span>
                </a>
                <a href="notes.html" class="nav-item active">
                    <i class="fa-solid fa-note-sticky"></i>
                    <span>Notes</span>
                </a>
                <a href="analytics.html" class="nav-item">
                    <i class="fa-solid fa-chart-pie"></i>
                    <span>Analytics</span>
                </a>
                <a href="profile.html" class="nav-item">
                    <i class="fa-solid fa-user"></i>
                    <span>Profile</span>
                </a>
            </nav>

            <div class="sidebar-footer">
                <div class="user-profile">
                    <div class="avatar"><i class="fa-solid fa-user"></i></div>
                    <div class="user-info">
                        <p class="user-name" id="userNameDisplay">Loading...</p>
                        <p class="user-role">Student</p>
                    </div>
                </div>
                <button class="btn-icon logout-btn" id="logoutBtn" title="Logout">
                    <i class="fa-solid fa-right-from-bracket"></i>
                </button>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <!-- Master Topbar -->
            <header class="topbar glass-panel">
                <div class="topbar-left">
                    <button class="btn-icon mobile-menu" id="sidebarOpen">
                        <i class="fa-solid fa-bars"></i>
                    </button>
                    <div class="search-bar">
                        <i class="fa-solid fa-magnifying-glass search-icon"></i>
                        <input type="text" id="searchInput" placeholder="Search notes...">
                    </div>
                </div>
                
                <div class="topbar-right">
                    <button class="btn-icon">
                        <i class="fa-regular fa-bell"></i>
                    </button>
                    <button class="btn-icon">
                        <i class="fa-solid fa-gear"></i>
                    </button>
                </div>
            </header>

            <div class="dashboard-content">
                <div class="welcome-section">
                    <div>
                        <h1 class="page-title text-gradient">My Notes 📝</h1>
                        <p class="page-subtitle">Organize and search your study notes.</p>
                    </div>
                    <div class="quick-actions">
                        <button class="btn btn-primary" id="addNoteBtn">
                            <i class="fa-solid fa-plus"></i> New Note
                        </button>
                    </div>
                </div>

                <!-- Notes Grid (Full Width) -->
                <div class="notes-grid" id="notesGrid">
                    <!-- Loading or Empty state injected via JS -->
                    <div class="empty-state">
                        <div class="empty-icon"><i class="fa-solid fa-note-sticky"></i></div>
                        <h3>No notes yet</h3>
                        <p>Click 'New Note' to get started!</p>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- Note Modal -->
    <div class="modal-overlay" id="noteModal">
        <div class="modal-content glass-panel">
            <div class="modal-header">
                <h3 id="modalTitle">New Note</h3>
                <button class="btn-icon" id="closeModalBtn"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <form id="noteForm" style="display: flex; flex-direction: column; overflow: hidden; height: 100%;">
                <div class="modal-body">
                    <input type="hidden" id="noteId">
                    <div class="form-group">
                        <label for="title">Title</label>
                        <input type="text" id="title" class="form-control" required placeholder="Give your note a title">
                    </div>
                    <div class="form-group">
                        <label for="subjectId">Subject (Optional)</label>
                        <select id="subjectId" class="form-control">
                            <option value="">No Subject</option>
                            <!-- Dynamic Subjects -->
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="content">Content</label>
                        <textarea id="content" class="form-control" rows="6" placeholder="Start typing..."></textarea>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" id="cancelNoteBtn">Cancel</button>
                    <button type="submit" class="btn btn-primary">Save Note</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Scripts -->
    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/notes.js"></script>
</body>
</html>
