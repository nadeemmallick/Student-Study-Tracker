<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Create Account – StudySync</title>
    <meta name="description"
        content="Create your free StudySync account and start tracking your study sessions, assignments, and academic goals." />
    <link rel="icon" type="image/png" href="assets/logo/favicon.png" />
    <link rel="stylesheet" href="css/forms.css" />
</head>

<body>

    <!-- Animated background -->
    <div class="bg-gradient"></div>
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>

    <!-- Register Card -->
    <div class="auth-wrapper">
        <div class="auth-card">

            <!-- Brand -->
            <div class="brand">
                <div class="brand-icon">
                    <img src="assets/logo/studysync-logo.png" alt="StudySync Logo" class="brand-logo-img" />
                </div>
                <span class="brand-name">StudySync</span>
            </div>

            <!-- Heading -->
            <h1 class="auth-title">Create account</h1>
            <p class="auth-subtitle">Start your academic journey with StudySync</p>

            <!-- Error message (shown on failed registration) -->
            <div id="reg-error" class="error-msg" role="alert"></div>

            <!-- Register Form -->
            <form id="register-form" novalidate>

                <div class="form-group">
                    <label for="reg-name">Full name</label>
                    <div class="input-wrap">
                        <span class="input-icon">
                            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24"
                                fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                                stroke-linejoin="round">
                                <path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2" />
                                <circle cx="12" cy="7" r="4" />
                            </svg>
                        </span>
                        <input type="text" id="reg-name" name="name" placeholder="Nadeem Mallick" autocomplete="name"
                            required />
                    </div>
                </div>

                <div class="form-group">
                    <label for="reg-email">Email address</label>
                    <div class="input-wrap">
                        <span class="input-icon">
                            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24"
                                fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                                stroke-linejoin="round">
                                <rect width="20" height="16" x="2" y="4" rx="2" />
                                <path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7" />
                            </svg>
                        </span>
                        <input type="email" id="reg-email" name="email" placeholder="you@example.com"
                            autocomplete="email" required />
                    </div>
                </div>

                <div class="form-group">
                    <label for="reg-password">Password</label>
                    <div class="input-wrap">
                        <span class="input-icon">
                            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24"
                                fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                                stroke-linejoin="round">
                                <rect width="18" height="11" x="3" y="11" rx="2" ry="2" />
                                <path d="M7 11V7a5 5 0 0 1 10 0v4" />
                            </svg>
                        </span>
                        <input type="password" id="reg-password" name="password" placeholder="Minimum 6 characters"
                            autocomplete="new-password" required minlength="6" />
                        <button type="button" class="password-toggle" title="Toggle password visibility"
                            aria-label="Toggle password visibility">
                            <svg class="eye-icon" xmlns="http://www.w3.org/2000/svg" width="18" height="18"
                                viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                                stroke-linecap="round" stroke-linejoin="round">
                                <path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z" />
                                <circle cx="12" cy="12" r="3" />
                            </svg>
                            <svg class="eye-off-icon" style="display:none;" xmlns="http://www.w3.org/2000/svg"
                                width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M9.88 9.88a3 3 0 1 0 4.24 4.24" />
                                <path
                                    d="M10.73 5.08A10.43 10.43 0 0 1 12 5c7 0 10 7 10 7a13.16 13.16 0 0 1-1.67 2.68" />
                                <path d="M6.61 6.61A13.52 13.52 0 0 0 2 12s3 7 10 7a9.74 9.74 0 0 0 5.39-1.61" />
                                <line x1="2" x2="22" y1="2" y2="22" />
                            </svg>
                        </button>
                    </div>
                </div>

                <button type="submit" id="reg-btn" class="btn-primary">
                    Create Account
                </button>

            </form>

            <div class="divider">or</div>

            <!-- Footer -->
            <p class="auth-footer">
                Already have an account? <a href="login.html">Sign in here</a>
            </p>

        </div>
    </div>

    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
</body>

</html>
