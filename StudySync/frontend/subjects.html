<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Subjects | StudySync</title>
    <!-- Fonts & Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <link rel="icon" type="image/x-icon" href="assets/favicon/favicon.ico">
    
    <!-- CSS -->
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/dashboard.css">
    <link rel="stylesheet" href="css/subjects.css">
</head>
<body>
    <!-- Animated Background -->
    <div class="bg-gradient"></div>
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>

    <div class="app-container">
        
        <!-- Sidebar -->
        <aside class="sidebar glass-panel" id="sidebar">
            <div class="sidebar-header">
                <div class="brand-icon">
                    <i class="fa-solid fa-bolt"></i>
                </div>
                <h2 class="brand-name">StudySync</h2>
                <button class="btn-icon mobile-close" id="sidebarClose">
                    <i class="fa-solid fa-xmark"></i>
                </button>
            </div>

            <nav class="sidebar-nav">
                <a href="dashboard.html" class="nav-item">
                    <i class="fa-solid fa-house"></i>
                    <span>Dashboard</span>
                </a>
                <a href="subjects.html" class="nav-item active">
                    <i class="fa-solid fa-book"></i>
                    <span>Subjects</span>
                </a>
                <a href="study-session.html" class="nav-item">
                    <i class="fa-solid fa-stopwatch"></i>
                    <span>Sessions</span>
                </a>
                <a href="assignments.html" class="nav-item">
                    <i class="fa-solid fa-clipboard-list"></i>
                    <span>Assignments</span>
                </a>
                <a href="goals.html" class="nav-item">
                    <i class="fa-solid fa-bullseye"></i>
                    <span>Goals</span>
                </a>
                <a href="notes.html" class="nav-item">
                    <i class="fa-solid fa-note-sticky"></i>
                    <span>Notes</span>
                </a>
                <a href="analytics.html" class="nav-item">
                    <i class="fa-solid fa-chart-pie"></i>
                    <span>Analytics</span>
                </a>
                <a href="profile.html" class="nav-item">
                    <i class="fa-solid fa-user"></i>
                    <span>Profile</span>
                </a>
            </nav>

            <div class="sidebar-footer">
                <div class="user-profile">
                    <div class="avatar"><i class="fa-solid fa-user"></i></div>
                    <div class="user-info">
                        <p class="user-name" id="userNameDisplay">Loading...</p>
                        <p class="user-role">Student</p>
                    </div>
                </div>
                <button class="btn-icon logout-btn" id="logoutBtn" title="Logout">
                    <i class="fa-solid fa-right-from-bracket"></i>
                </button>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            
            <!-- Topbar -->
            <header class="topbar glass-panel">
                <div class="topbar-left">
                    <button class="btn-icon mobile-menu" id="sidebarOpen">
                        <i class="fa-solid fa-bars"></i>
                    </button>
                    <div class="search-bar">
                        <i class="fa-solid fa-magnifying-glass search-icon"></i>
                        <input type="text" placeholder="Search subjects...">
                    </div>
                </div>
                
                <div class="topbar-right">
                    <button class="btn-icon">
                        <i class="fa-regular fa-bell"></i>
                    </button>
                    <button class="btn-icon">
                        <i class="fa-solid fa-gear"></i>
                    </button>
                </div>
            </header>

            <!-- Subjects Content -->
            <div class="dashboard-content">
                
                <div class="welcome-section">
                    <div>
                        <h1 class="page-title text-gradient">Your Subjects 📚</h1>
                        <p class="page-subtitle">Manage the subjects you are studying.</p>
                    </div>
                    <div class="quick-actions">
                        <button class="btn btn-primary" id="addSubjectBtn">
                            <i class="fa-solid fa-plus"></i> Add New Subject
                        </button>
                    </div>
                </div>

                <!-- Subjects Grid -->
                <div class="subjects-grid" id="subjectsGrid">
                    <!-- Subjects will be dynamically injected here -->
                    <div class="loading-state">Loading subjects...</div>
                </div>
                
            </div>
        </main>
    </div>

    <!-- Subject Modal (Hidden by default) -->
    <div class="modal-overlay" id="subjectModal">
        <div class="modal-content glass-panel">
            <div class="modal-header">
                <h3 id="modalTitle">Add New Subject</h3>
                <button class="btn-icon" id="closeModalBtn">
                    <i class="fa-solid fa-xmark"></i>
                </button>
            </div>
            <form id="subjectForm">
                <input type="hidden" id="subjectIdInput">
                
                <div class="form-group">
                    <label>Subject Name</label>
                    <div class="input-wrap">
                        <input type="text" id="subjectNameInput" placeholder="e.g. Mathematics" required>
                    </div>
                </div>
                
                <div class="form-group">
                    <label>Description</label>
                    <div class="input-wrap">
                        <input type="text" id="subjectDescInput" placeholder="e.g. Calculus & Algebra">
                    </div>
                </div>
                
                <div class="form-group">
                    <label>Color Theme</label>
                    <div class="color-picker-group" id="colorPickerGroup">
                        <div class="color-option selected" data-color="#7c3aed" style="background: #7c3aed;"></div>
                        <div class="color-option" data-color="#3b82f6" style="background: #3b82f6;"></div>
                        <div class="color-option" data-color="#10b981" style="background: #10b981;"></div>
                        <div class="color-option" data-color="#f59e0b" style="background: #f59e0b;"></div>
                        <div class="color-option" data-color="#ef4444" style="background: #ef4444;"></div>
                        <div class="color-option" data-color="#ec4899" style="background: #ec4899;"></div>
                    </div>
                    <input type="hidden" id="subjectColorInput" value="#7c3aed">
                </div>

                <div class="form-actions">
                    <button type="button" class="btn btn-secondary" id="cancelModalBtn">Cancel</button>
                    <button type="submit" class="btn btn-primary">Save Subject</button>
                </div>
            </form>
        </div>
    </div>

    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/dashboard.js"></script>
    <script src="js/subjects.js"></script>
</body>
</html>
